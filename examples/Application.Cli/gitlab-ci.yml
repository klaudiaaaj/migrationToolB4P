stages:
  - validate

variables:
  GIT_DEPTH: "20"

# W ustawieniach projektu włącz:
# Settings > Merge requests > Enable merged results pipelines.
#
# GitLab uruchomi ten job na tymczasowym commicie zawierającym połączony
# source branch i aktualny target branch. Check działa jako skrypt POSIX sh
# i nie wymaga obrazu z .NET SDK.
validate-migrations:
  stage: validate
  # Możesz tutaj pozostawić własny obraz. Musi zawierać git i podstawowe
  # narzędzia POSIX: sh, find, sed, awk, sort oraz cmp.
  image: alpine:3.20
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  before_script:
    - |
      if ! command -v git >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache git
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates
        else
          echo "Obraz nie zawiera Gita ani obsługiwanego managera pakietów." >&2
          exit 2
        fi
      fi
    - git --version
    - git fetch --depth=1 origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

  script:
    - |
      set -eu

      if [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}" ]; then
        TARGET_REF="$CI_MERGE_REQUEST_TARGET_BRANCH_SHA"
      else
        TARGET_REF="origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      fi

      echo "MR event type: ${CI_MERGE_REQUEST_EVENT_TYPE:-unknown}"
      echo "Merged result commit: $CI_COMMIT_SHA"
      echo "Migration target: $TARGET_REF"

      time sh scripts/migrationtool.sh \
        check \
        --repo "$CI_PROJECT_DIR" \
        --config migrationtool.json \
        --target-ref "$TARGET_REF"
